apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: as-bank
spec:
  role: "{{ .Values.nodeRoleName }}"

  amiSelectorTerms:
    - alias: al2023@latest

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "{{ .Values.clusterName }}"

  securityGroupSelectorTerms:
    - id: "{{ .Values.clusterSecurityGroupId }}"

  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required

  tags:
    Project: as-bank
    ManagedBy: karpenter
    Environment: "{{ .Values.environment }}"
    CostCenter: learning
    Repository: as-bank-infra
