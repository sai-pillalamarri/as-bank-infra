apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: as-bank
spec:
  template:
    metadata:
      labels:
        as-bank.io/capacity: karpenter

    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: as-bank

      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64

        - key: kubernetes.io/os
          operator: In
          values:
            - linux

        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - "{{ .Values.capacityType }}"

        # The AWS Free account plan rejects other EC2 instance types before launch.
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - c7i-flex.large
            - m7i-flex.large

      expireAfter: 720h

  limits:
    cpu: "32"

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
