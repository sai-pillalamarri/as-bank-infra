name: Environment down

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.15.8"

jobs:
  down:
    name: Destroy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    concurrency:
      group: terraform-cluster-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Resolve apply role
        id: role
        shell: bash
        env:
          DEV_ROLE: ${{ vars.AWS_INFRA_DEV_APPLY_ROLE_ARN }}
          PROD_ROLE: ${{ vars.AWS_INFRA_PROD_APPLY_ROLE_ARN }}
        run: |
          set -euo pipefail

          if [[ "${{ inputs.environment }}" == "prod" ]]; then
            role_arn="${PROD_ROLE}"
          else
            role_arn="${DEV_ROLE}"
          fi

          [[ -n "${role_arn}" ]]
          echo "arn=${role_arn}" >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          role-session-name: environment-down-${{ inputs.environment }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Destroy cluster layer
        shell: bash
        run: |
          set -euo pipefail

          environment="${{ inputs.environment }}"
          root="terraform/cluster/${environment}"
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          bucket="as-bank-terraform-state-${account_id}"
          cluster_key="cluster/${environment}/terraform.tfstate"

          if ! aws s3api head-object \
            --bucket "${bucket}" \
            --key "${cluster_key}" >/dev/null 2>&1; then
            echo "${environment} cluster state does not exist. Nothing to destroy."
            exit 0
          fi

          terraform -chdir="${root}" init \
            -input=false \
            -backend-config="bucket=${bucket}"

          terraform -chdir="${root}" plan \
            -destroy \
            -input=false \
            -var="install_karpenter=true" \
            -var="install_external_secrets=true" \
            -var="install_kyverno=true" \
            -var="install_argocd=true" \
            -out=destroy.tfplan

          terraform -chdir="${root}" apply \
            -input=false \
            -auto-approve \
            destroy.tfplan
