name: Terraform apply

on:
  push:
    branches:
      - main
    paths:
      - "terraform/bootstrap/**"
      - "terraform/modules/network/**"
      - "terraform/network/**"
      - ".github/workflows/terraform-apply.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.15.8"

jobs:
  apply:
    name: Apply ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bootstrap
            root: terraform/bootstrap
            role: shared

          - name: network-dev
            root: terraform/network/dev
            role: dev

          - name: network-prod
            root: terraform/network/prod
            role: prod

    env:
      SHARED_APPLY_ROLE_ARN: ${{ vars.AWS_INFRA_APPLY_ROLE_ARN }}
      DEV_APPLY_ROLE_ARN: ${{ vars.AWS_INFRA_DEV_APPLY_ROLE_ARN }}
      PROD_APPLY_ROLE_ARN: ${{ vars.AWS_INFRA_PROD_APPLY_ROLE_ARN }}

    concurrency:
      group: terraform-${{ matrix.name }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Resolve apply role
        id: role
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.role }}" in
            shared) role_arn="${SHARED_APPLY_ROLE_ARN}" ;;
            dev) role_arn="${DEV_APPLY_ROLE_ARN}" ;;
            prod) role_arn="${PROD_APPLY_ROLE_ARN}" ;;
            *) echo "Unknown role selector"; exit 1 ;;
          esac

          [[ -n "${role_arn}" ]]
          echo "arn=${role_arn}" >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          role-session-name: terraform-apply-${{ matrix.name }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Apply
        shell: bash
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          bucket="as-bank-terraform-state-${account_id}"
          root="${{ matrix.root }}"

          terraform -chdir="${root}" init \
            -input=false \
            -backend-config="bucket=${bucket}"

          terraform -chdir="${root}" plan \
            -input=false \
            -out=tfplan

          terraform -chdir="${root}" apply \
            -input=false \
            -auto-approve \
            tfplan
