name: Terraform apply

on:
  push:
    branches:
      - main
    paths:
      - "terraform/bootstrap/**"
      - "terraform/modules/network/**"
      - "terraform/network/**"
      - ".github/workflows/terraform-apply.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.15.8"

jobs:
  bootstrap:
    name: Apply bootstrap
    runs-on: ubuntu-latest

    concurrency:
      group: terraform-bootstrap
      cancel-in-progress: false

    env:
      APPLY_ROLE_ARN: ${{ vars.AWS_INFRA_APPLY_ROLE_ARN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ env.APPLY_ROLE_ARN }}
          role-session-name: terraform-apply-bootstrap
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Apply
        shell: bash
        env:
          TF_VAR_budget_alert_email: ${{ secrets.BOOTSTRAP_BUDGET_ALERT_EMAIL }}
          TF_VAR_github_owner: ${{ vars.BOOTSTRAP_GITHUB_OWNER }}
          TF_VAR_github_owner_id: ${{ vars.BOOTSTRAP_GITHUB_OWNER_ID }}
          TF_VAR_as_bank_app_repository_id: ${{ vars.BOOTSTRAP_APP_REPOSITORY_ID }}
          TF_VAR_as_bank_infra_repository_id: ${{ vars.BOOTSTRAP_INFRA_REPOSITORY_ID }}
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          bucket="as-bank-terraform-state-${account_id}"

          terraform -chdir=terraform/bootstrap init \
            -input=false \
            -backend-config="bucket=${bucket}"

          terraform -chdir=terraform/bootstrap plan \
            -input=false \
            -out=tfplan

          terraform -chdir=terraform/bootstrap apply \
            -input=false \
            -auto-approve \
            tfplan

  network:
    name: Apply network-${{ matrix.environment }}
    needs: bootstrap
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            role_arn: ${{ vars.AWS_INFRA_DEV_APPLY_ROLE_ARN }}

          - environment: prod
            role_arn: ${{ vars.AWS_INFRA_PROD_APPLY_ROLE_ARN }}

    concurrency:
      group: terraform-network-${{ matrix.environment }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ matrix.role_arn }}
          role-session-name: terraform-apply-network-${{ matrix.environment }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Apply
        shell: bash
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          bucket="as-bank-terraform-state-${account_id}"
          root="terraform/network/${{ matrix.environment }}"

          terraform -chdir="${root}" init \
            -input=false \
            -backend-config="bucket=${bucket}"

          terraform -chdir="${root}" plan \
            -input=false \
            -out=tfplan

          terraform -chdir="${root}" apply \
            -input=false \
            -auto-approve \
            tfplan
