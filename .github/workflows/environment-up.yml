name: Environment up

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to create
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.15.8"

jobs:
  up:
    name: Create ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    concurrency:
      group: terraform-environment-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Resolve apply role
        id: role
        shell: bash
        env:
          DEV_ROLE: ${{ vars.AWS_INFRA_DEV_APPLY_ROLE_ARN }}
          PROD_ROLE: ${{ vars.AWS_INFRA_PROD_APPLY_ROLE_ARN }}
        run: |
          set -euo pipefail

          if [[ "${{ inputs.environment }}" == "prod" ]]; then
            role_arn="${PROD_ROLE}"
          else
            role_arn="${DEV_ROLE}"
          fi

          [[ -n "${role_arn}" ]]
          echo "arn=${role_arn}" >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          role-session-name: environment-up-${{ inputs.environment }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Create or restore data layer
        shell: bash
        run: |
          set -euo pipefail

          environment="${{ inputs.environment }}"
          root="terraform/data/${environment}"

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          bucket="as-bank-terraform-state-${account_id}"
          network_key="network/${environment}/terraform.tfstate"

          aws s3api head-object \
            --bucket "${bucket}" \
            --key "${network_key}" >/dev/null

          terraform -chdir="${root}" init \
            -input=false \
            -backend-config="bucket=${bucket}"

          snapshots="$(
            aws rds describe-db-snapshots \
              --snapshot-type manual \
              --region "${AWS_REGION}" \
              --output json
          )"

          snapshot_identifiers='{}'
          snapshot_count=0

          for service in customer account transaction; do
            prefix="as-bank-${environment}-${service}-final-"

            latest_snapshot="$(
              jq -r \
                --arg prefix "${prefix}" \
                '[
                  .DBSnapshots[]
                  | select(.DBSnapshotIdentifier | startswith($prefix))
                ]
                | sort_by(.SnapshotCreateTime)
                | last
                | .DBSnapshotIdentifier // empty' \
                <<< "${snapshots}"
            )"

            if [[ -n "${latest_snapshot}" ]]; then
              snapshot_identifiers="$(
                jq -c \
                  --arg service "${service}" \
                  --arg snapshot "${latest_snapshot}" \
                  '. + {($service): $snapshot}' \
                  <<< "${snapshot_identifiers}"
              )"

              snapshot_count=$((snapshot_count + 1))
            fi
          done

          # Restore all service databases from one environment lifecycle or start clean.
          if (( snapshot_count != 0 && snapshot_count != 3 )); then
            echo "Expected either zero or three service snapshots for ${environment}; found ${snapshot_count}."
            exit 1
          fi

          if (( snapshot_count == 3 )); then
            echo "Restoring ${environment} databases from the latest final snapshots."
          else
            echo "No final snapshots found for ${environment}. Creating fresh databases."
          fi

          terraform -chdir="${root}" plan \
            -input=false \
            -var="databases_enabled=true" \
            -var="snapshot_identifiers=${snapshot_identifiers}" \
            -out=data.tfplan

          terraform -chdir="${root}" apply \
            -input=false \
            -auto-approve \
            data.tfplan

      - name: Verify data layer
        shell: bash
        run: |
          set -euo pipefail

          environment="${{ inputs.environment }}"

          for service in customer account transaction; do
            identifier="as-bank-${environment}-${service}"

            aws rds wait db-instance-available \
              --db-instance-identifier "${identifier}" \
              --region "${AWS_REGION}"
          done

          aws rds describe-db-instances \
            --region "${AWS_REGION}" \
            --query "DBInstances[?starts_with(DBInstanceIdentifier, 'as-bank-${environment}-')].{Name:DBInstanceIdentifier,Engine:Engine,Class:DBInstanceClass,AZ:AvailabilityZone,MultiAZ:MultiAZ,Status:DBInstanceStatus}" \
            --output table

      - name: Create cluster layer
        shell: bash
        run: |
          set -euo pipefail

          environment="${{ inputs.environment }}"
          root="terraform/cluster/${environment}"

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          bucket="as-bank-terraform-state-${account_id}"
          network_key="network/${environment}/terraform.tfstate"

          aws s3api head-object \
            --bucket "${bucket}" \
            --key "${network_key}" >/dev/null

          terraform -chdir="${root}" init \
            -input=false \
            -backend-config="bucket=${bucket}"

          cluster_name="as-bank-${environment}"

          if ! aws eks describe-cluster \
            --name "${cluster_name}" \
            --region "${AWS_REGION}" >/dev/null 2>&1; then

            # Helm providers cannot reach Kubernetes until the EKS API exists.
            terraform -chdir="${root}" plan \
              -input=false \
              -var="install_karpenter=false" \
              -var="install_external_secrets=false" \
              -var="install_kyverno=false" \
              -var="install_argocd=false" \
              -out=cluster.tfplan

            terraform -chdir="${root}" apply \
              -input=false \
              -auto-approve \
              cluster.tfplan
          fi

          terraform -chdir="${root}" plan \
            -input=false \
            -var="install_karpenter=true" \
            -var="install_external_secrets=true" \
            -var="install_kyverno=true" \
            -var="install_argocd=true" \
            -out=runtime.tfplan

          terraform -chdir="${root}" apply \
            -input=false \
            -auto-approve \
            runtime.tfplan

      - name: Verify EKS
        shell: bash
        run: |
          set -euo pipefail

          aws eks describe-cluster \
            --name "as-bank-${{ inputs.environment }}" \
            --query 'cluster.{Name:name,Status:status,Version:version}' \
            --output table
