name: Terraform plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"
      - ".github/workflows/environment-*.yml"
      - "Makefile"

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.15.8"
  TFLINT_VERSION: "v0.63.0"
  CHECKOV_VERSION: "3.3.9"

jobs:
  static:
    name: Terraform static checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive terraform

      - name: Validate roots
        shell: bash
        run: |
          set -euo pipefail

          roots=(
            terraform/bootstrap
            terraform/network/dev
            terraform/network/prod
            terraform/cluster/dev
            terraform/cluster/prod
          )

          for root in "${roots[@]}"; do
            echo "Validating ${root}"
            terraform -chdir="${root}" init -backend=false -input=false
            terraform -chdir="${root}" validate
          done

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Run TFLint
        shell: bash
        run: |
          set -euo pipefail

          roots=(
            terraform/bootstrap
            terraform/network/dev
            terraform/network/prod
            terraform/cluster/dev
            terraform/cluster/prod
          )

          for root in "${roots[@]}"; do
            echo "Linting ${root}"
            (
              cd "${root}"
              tflint --format=compact
            )
          done

      - name: Install Checkov
        run: python -m pip install --disable-pip-version-check "checkov==${CHECKOV_VERSION}"

      - name: Run Checkov
        run: >-
          checkov -d terraform
          --framework terraform
          --compact

  plan:
    name: Plan ${{ matrix.name }}
    needs: static
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bootstrap
            root: terraform/bootstrap
            role: shared
            network_state_key: ""

          - name: network-dev
            root: terraform/network/dev
            role: dev
            network_state_key: ""

          - name: network-prod
            root: terraform/network/prod
            role: prod
            network_state_key: ""

          - name: cluster-dev
            root: terraform/cluster/dev
            role: dev
            network_state_key: network/dev/terraform.tfstate

          - name: cluster-prod
            root: terraform/cluster/prod
            role: prod
            network_state_key: network/prod/terraform.tfstate

    env:
      SHARED_PLAN_ROLE_ARN: ${{ vars.AWS_INFRA_PLAN_ROLE_ARN }}
      DEV_PLAN_ROLE_ARN: ${{ vars.AWS_INFRA_DEV_PLAN_ROLE_ARN }}
      PROD_PLAN_ROLE_ARN: ${{ vars.AWS_INFRA_PROD_PLAN_ROLE_ARN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Resolve plan role
        id: role
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.role }}" in
            shared) role_arn="${SHARED_PLAN_ROLE_ARN}" ;;
            dev) role_arn="${DEV_PLAN_ROLE_ARN}" ;;
            prod) role_arn="${PROD_PLAN_ROLE_ARN}" ;;
            *) echo "Unknown role selector"; exit 1 ;;
          esac

          if [[ -z "${role_arn}" ]]; then
            echo "Required GitHub repository variable is empty."
            exit 1
          fi

          echo "arn=${role_arn}" >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          role-session-name: terraform-plan-${{ matrix.name }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Resolve state bucket
        id: state
        shell: bash
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          bucket="as-bank-terraform-state-${account_id}"

          echo "bucket=${bucket}" >> "${GITHUB_OUTPUT}"

          network_key="${{ matrix.network_state_key }}"

          if [[ -z "${network_key}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if aws s3api head-object \
            --bucket "${bucket}" \
            --key "${network_key}" >/dev/null 2>&1; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Plan
        if: steps.state.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TF_VAR_budget_alert_email: ${{ matrix.name == 'bootstrap' && secrets.BOOTSTRAP_BUDGET_ALERT_EMAIL || '' }}
          TF_VAR_github_owner: ${{ matrix.name == 'bootstrap' && vars.BOOTSTRAP_GITHUB_OWNER || '' }}
          TF_VAR_github_owner_id: ${{ matrix.name == 'bootstrap' && vars.BOOTSTRAP_GITHUB_OWNER_ID || '' }}
          TF_VAR_as_bank_app_repository_id: ${{ matrix.name == 'bootstrap' && vars.BOOTSTRAP_APP_REPOSITORY_ID || '' }}
          TF_VAR_as_bank_infra_repository_id: ${{ matrix.name == 'bootstrap' && vars.BOOTSTRAP_INFRA_REPOSITORY_ID || '' }}
        run: |
          set -euo pipefail

          root="${{ matrix.root }}"
          bucket="${{ steps.state.outputs.bucket }}"
          plan_text="${RUNNER_TEMP}/${{ matrix.name }}.txt"
          comment="${RUNNER_TEMP}/${{ matrix.name }}-comment.md"

          terraform -chdir="${root}" init \
            -input=false \
            -backend-config="bucket=${bucket}"

          plan_args=()

          if [[ "${{ matrix.name }}" == cluster-* ]]; then
            matrix_name="${{ matrix.name }}"
            environment="${matrix_name#cluster-}"

            if aws eks describe-cluster \
              --name "as-bank-${environment}" \
              --region "${AWS_REGION}" >/dev/null 2>&1; then
              plan_args+=('-var=install_karpenter=true')
            else
              # Helm cannot read Kubernetes state until the EKS API exists.
              plan_args+=('-var=install_karpenter=false')
            fi
          fi

          set +e
          terraform -chdir="${root}" plan \
            -input=false \
            -no-color \
            "${plan_args[@]}" \
            -out=tfplan > "${plan_text}" 2>&1
          status=$?
          set -e

          {
            echo "### Terraform plan — ${{ matrix.name }}"
            echo
            echo "<details>"
            echo "<summary>Show plan</summary>"
            echo
            echo '```text'
            head -c 50000 "${plan_text}"
            echo
            echo '```'
            echo "</details>"
          } > "${comment}"

          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file "${comment}"

          exit "${status}"

      - name: Record deferred initial cluster plan
        if: steps.state.outputs.available == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "### Terraform plan — ${{ matrix.name }}

          Layer 1 state does not exist yet. This initial cluster plan is deferred until the network layer has been created. Later pull requests plan this layer normally."

  gate:
    name: Terraform PR gate
    if: always()
    needs:
      - static
      - plan
    runs-on: ubuntu-latest

    steps:
      - name: Require Terraform checks
        shell: bash
        run: |
          [[ "${{ needs.static.result }}" == "success" ]]
          [[ "${{ needs.plan.result }}" == "success" ]]
